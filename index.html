const KEY='stardex.user.v1',PK='stardex.prices.v1',FK='stardex.fav.v1';
const readJSON=(key,fallback)=>{try{let v=JSON.parse(localStorage.getItem(key));return v??fallback}catch{return fallback}};
const writeJSON=(key,val)=>{try{localStorage.setItem(key,JSON.stringify(val));return true}catch{notify('儲存失敗，請確認瀏覽器儲存空間');return false}};
const kindKeys=Object.keys(KINDS);
const state={tab:'home',kind:'all',query:'',level:'',favOnly:false,sort:'default',users:readJSON(KEY,[]),prices:readJSON(PK,[]),favs:readJSON(FK,[]),detail:null,dialog:null,edit:null};
const byId=id=>[...seed,...state.users].find(x=>x.id===id);
const validUrl=url=>{try{const u=new URL(url);return /^https?:$/.test(u.protocol)?u.href:''}catch{return''}};
const esc=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=value=>Number(value||0).toLocaleString('zh-TW');
const all=()=>[...seed,...state.users];
function getEntries(){let items=all();if(state.kind!=='all')items=items.filter(x=>x.kind===state.kind);if(state.favOnly)items=items.filter(x=>state.favs.includes(x.id));const q=state.query.trim().toLocaleLowerCase();if(q)items=items.filter(x=>[x.title,x.note,x.region,x.related,x.level,x.kind].join(' ').toLocaleLowerCase().includes(q));if(state.level&&state.kind==='monster')items=items.filter(x=>!x.level||Number(x.level)<=Number(state.level));if(state.sort==='name')items.sort((a,b)=>a.title.localeCompare(b.title,'zh-Hant'));if(state.sort==='new')items.sort((a,b)=>(b.date||'').localeCompare(a.date||''));return items}
function notify(message){const old=document.getElementById('toast');if(old)old.remove();const node=document.createElement('div');node.id='toast';node.className='toast';node.textContent=message;document.body.appendChild(node);setTimeout(()=>node.remove(),3000)}
const navItems=[['home','🏠','首頁'],['catalog','📚','圖鑑'],['guide','🧭','攻略'],['market','💰','行情'],['mine','⭐','我的']];
function navigate(tab,kind){state.tab=tab;if(kind!==undefined)state.kind=kind;state.query='';state.favOnly=false;state.level='';window.scrollTo(0,0);render()}
function navButton(tab,icon,name,cls){return `<button class="${cls} ${state.tab===tab?'active':''}" data-tab="${tab}"><span>${icon}</span><span>${name}</span></button>`}
function scaffold(){return `<div class="layout"><aside class="sidebar"><div class="brand"><div class="mark">🍁</div><div><strong>星圖鑑</strong><small>STARDEX · 非官方玩家站</small></div></div><div class="navgroup-title">探索</div>${navItems.map(([a,b,c])=>navButton(a,b,c,'snav')).join('')}<div class="navgroup-title">資料類別</div>${kindKeys.map(k=>`<button class="snav ${state.tab==='catalog'&&state.kind===k?'active':''}" data-kind="${k}"><span>${KINDS[k].icon}</span>${KINDS[k].short}<span class="count">${all().filter(x=>x.kind===k).length}</span></button>`).join('')}<div class="sidebar-bottom"><strong>📢 玩家共同維護</strong>以官方更新為初始內容；未驗證的等級、掉落率、物價一律不亂填。<br>資料保存在此裝置。</div></aside><section class="main"><header class="topbar"><span class="crumb">楓星玩家百科 <span style="color:#b7c1cf">／</span> ${esc(({home:'探索首頁',catalog:'資料圖鑑',guide:'練等與攻略',market:'玩家行情',mine:'個人資料'})[state.tab])}</span><div class="topbar-actions"><span class="date">資料基準：2026/10/10</span><button class="btn primary" data-dialog="entry">＋ 新增資料</button></div></header><div class="mobile-bar"><div class="mini-brand"><div class="mark">🍁</div><span>星圖鑑 <small style="font-size:10px;color:#97a1b2">BETA</small></span></div><button class="btn sm primary" data-dialog="entry">＋ 新增</button></div><main class="content" id="content"></main></section></div><nav class="mobile-nav">${navItems.map(([a,b,c])=>navButton(a,b,c,'mnav')).join('')}</nav><div id="modalHost"></div>`}
function card(x){const kind=KINDS[x.kind]||KINDS.guide;const fav=state.favs.includes(x.id);return `<article class="entry"><div class="upper"><span class="big-icon">${kind.icon}</span><button class="heart ${fav?'on':''}" data-fav="${esc(x.id)}" title="${fav?'取消收藏':'加入收藏'}">${fav?'★':'☆'}</button></div><div><h3>${esc(x.title)}</h3><div style="margin-top:6px"><span class="tag gray">${kind.short}</span> ${x.official?'<span class="tag official">官方公告</span>':'<span class="tag user">自建資料</span>'}</div></div><div class="snippet">${esc(x.note)}</div><div class="foot"><span style="font-size:11px;color:#99a5b7">${x.level?'Lv. '+esc(x.level):x.date?esc(x.date):'待補詳細資料'}</span><button class="mini-link" data-detail="${esc(x.id)}">查看詳情 →</button></div></article>`}
function empty(message,button='<button class="btn primary" data-dialog="entry">＋ 建立第一筆資料</button>'){return `<div class="empty"><div class="illus">📭</div><h3>這裡還沒有符合的資料</h3><p>${message}</p>${button}</div>`}
function home(){const favorites=state.favs.length;const kindsCount=kindKeys.length;return `<section class="hero"><div class="eyebrow">MAPLESTAR PLAYER COMPANION</div><h1>你的楓星冒險，<br>一個圖鑑就搞定。</h1><p>怪物掉落、裝備、地圖、職業、任務、攻略與楓幣價格，逐步整理成專屬楓星的玩家百科。</p><div class="hero-actions"><button class="btn" data-tab="catalog">📖 開始探索</button><button class="btn ghost" data-dialog="entry">＋ 貢獻資料</button></div></section><div class="summary"><div class="stat"><div class="sticon">📚</div><div class="n">${num(all().length)}</div><div class="desc">目前收錄條目</div></div><div class="stat"><div class="sticon">🗂️</div><div class="n">${kindsCount}</div><div class="desc">資料主題分類</div></div><div class="stat"><div class="sticon">⭐</div><div class="n">${num(favorites)}</div><div class="desc">我的收藏</div></div><div class="stat"><div class="sticon">💰</div><div class="n">${num(state.prices.length)}</div><div class="desc">個人物價紀錄</div></div></div><div class="section-title"><div><h2>探索資料庫</h2><p>找怪物、查掉落、看職業、找練功地圖</p></div><button class="link-btn" data-tab="catalog">查看全部 →</button></div><div class="categories">${kindKeys.map(k=>`<button class="category" data-kind="${k}"><span class="emoji">${KINDS[k].icon}</span><strong>${KINDS[k].title}</strong><span class="meta">目前 ${all().filter(x=>x.kind===k).length} 筆</span></button>`).join('')}</div><div class="section-title"><div><h2>最新官方重點</h2><p>僅展示可追溯的公告摘要</p></div></div><div class="grid2"><div class="panel"><div class="update"><div class="dateblock">10 / 08</div><div><h4>新加坡、結婚小鎮開放</h4><p>新地區、三隻每週挑戰 BOSS，怪物圖鑑新增區域與收集效果。 <a href="${URLS.oct}" target="_blank" rel="noopener">查看公告 ↗</a></p></div></div><div class="update"><div class="dateblock">10 / 08</div><div><h4>一般重置時間改為 08:00</h4><p>每週重置日改為週四；101 大道另於週一與週四重置。 <a href="${URLS.oct}" target="_blank" rel="noopener">查看公告 ↗</a></p></div></div><div class="update"><div class="dateblock">07 / 09</div><div><h4>技能書掉落調整</h4><p>一般技能書停止掉落（楓葉祝福技能書除外）；神祕技能書的掉落設定調整。 <a href="${URLS.jul}" target="_blank" rel="noopener">查看公告 ↗</a></p></div></div></div><div class="panel"><h3>🛡️ 我們如何標示資料？</h3><div class="row-line"><strong><span class="tag official">官方公告</span></strong><small>可點擊原始來源</small></div><div class="row-line"><strong><span class="tag user">自建資料</span></strong><small>本機自行輸入，尚未審核</small></div><p class="explain">空白的掉落率、地圖等級、交易價格代表「尚未有可信資料」，不是 0。未來可加入社群回報、多人審核、即時同步。</p><button class="btn soft sm" data-tab="mine">備份或匯入資料 →</button></div></div>`}
function catalog(){const rows=getEntries();return `<div class="page-h"><div><h1>📚 資料圖鑑</h1><p>搜尋名稱、地區、關聯掉落物與攻略內容；點開資料可看來源。</p></div><button class="btn primary" data-dialog="entry">＋ 新增條目</button></div><div class="toolbar"><label class="searchbar">🔎 <input id="globalSearch" type="search" value="${esc(state.query)}" placeholder="搜尋怪物、裝備、地圖、技能..." autocomplete="off"></label><select id="sort" class="select" aria-label="排序"><option value="default" ${state.sort==='default'?'selected':''}>預設排序</option><option value="name" ${state.sort==='name'?'selected':''}>依名稱排序</option><option value="new" ${state.sort==='new'?'selected':''}>最新資料</option></select></div><div class="filters"><button class="filter ${state.kind==='all'?'active':''}" data-filter="all">全部</button>${kindKeys.map(k=>`<button class="filter ${state.kind===k?'active':''}" data-filter="${k}">${KINDS[k].icon} ${KINDS[k].short}</button>`).join('')}</div><div id="catalogResults">${resultHtml(rows)}</div>`}
function resultHtml(rows){return `<div style="display:flex;justify-content:space-between;align-items:center;margin:0 0 15px;color:#8693a5;font-size:12px"><span>符合條件：<strong>${rows.length}</strong> 筆</span><span>✨ 官方公告與自建資料皆可搜尋</span></div><div class="cards">${rows.length?rows.map(card).join(''):empty('換個關鍵字，或親自新增你查到的楓星資料。')}</div>`}
function guide(){const examples=all().filter(x=>['guide','job','quest','boss'].includes(x.kind));return `<div class="page-h"><div><h1>🧭 職業與練等攻略</h1><p>攻略資料會隨楓星版本調整；目前只放已找到來源的項目。</p></div><button class="btn primary" data-dialog="entry" data-kind-add="guide">＋ 新增攻略</button></div><div class="inline-note" style="margin:24px 0"><strong>練功地圖推薦功能已預留：</strong>後續錄入各地圖建議等級、怪物經驗值與密度後，就能依照角色等級篩選與排序。現在不會亂推薦未驗證的地圖。</div><div class="section-title"><div><h2>職業・任務・BOSS・攻略</h2><p>點選條目閱讀摘要、來源或自行補充</p></div></div><div class="cards">${examples.map(card).join('')}</div>`}
function market(){const prices=state.prices.slice().sort((a,b)=>b.ts-a.ts);const byItem=new Map();for(const p of prices){const name=p.item.trim();if(!byItem.has(name))byItem.set(name,[]);byItem.get(name).push(p)}const items=[...byItem.entries()].map(([name,rs])=>({name,rs,median:[...rs].map(r=>Number(r.price)).sort((a,b)=>a-b)[Math.floor(rs.length/2)]}));return `<div class="page-h"><div><h1>💰 楓幣行情筆記</h1><p>手動記錄看到的售價、成交價，為自己的打寶選擇提供參考。</p></div><button class="btn primary" data-dialog="price">＋ 新增價格</button></div><div class="inline-note" style="margin:22px 0"><strong>注意：</strong>以下只有你在這台裝置輸入的價錢，不是楓星拍賣場的即時報價。無資料就顯示空白，避免憑空產生價格。</div>${items.length?`<div class="section-title"><div><h2>近期物品價位</h2><p>顯示各物品已記錄的中位數；樣本少時不應視為市價</p></div></div><div class="price-box">${items.map(o=>`<div class="price-card"><h3>📦 ${esc(o.name)}</h3><div class="amount">${num(o.median)} <span style="font-size:11px;color:#91a0b3">楓幣</span></div><p>${o.rs.length} 筆紀錄・最後 ${esc(new Date(o.rs[0].ts).toLocaleDateString('zh-TW'))}</p><button class="mini-link" data-market-search="${esc(o.name)}">查看紀錄 →</button></div>`).join('')}</div><div class="section-title"><div><h2>最新價格紀錄</h2></div></div><div class="panel" id="priceReports">${prices.map(p=>priceLine(p)).join('')}</div>`:`<div style="margin-top:20px">${empty('目前還沒有價格紀錄。先把你在遊戲裡看到的物品報價或實際成交價登記進來。','<button class="btn primary" data-dialog="price">＋ 記錄第一筆價格</button>')}</div>`}`}
function priceLine(p){return `<div class="report"><div><b>${esc(p.item)}</b><small>${esc(p.world||'未填伺服器')}・${esc(p.type||'觀察報價')}・${esc(p.memo||'無備註')}</small><small>${esc(new Date(p.ts).toLocaleString('zh-TW'))}</small></div><div class="right"><b>${num(p.price)} 楓幣</b><small><button class="mini-link" data-remove-price="${esc(p.id)}">刪除</button></small></div></div>`}
function mine(){const fav=all().filter(x=>state.favs.includes(x.id));return `<div class="page-h"><div><h1>⭐ 我的冒險筆記</h1><p>收藏條目、備份與匯入資料，都放在這裡。</p></div></div><div class="section-title"><div><h2>我的收藏 <span style="font-weight:400;color:#a1acba">${fav.length}</span></h2></div></div><div class="cards">${fav.length?fav.map(card).join(''):empty('在圖鑑卡片右上角點星星，就能將常查的資料存到這裡。','<button class="btn soft" data-tab="catalog">前往圖鑑 →</button>')}</div><div class="section-title"><div><h2>資料工具</h2><p>資料只會存在目前的瀏覽器。換手機前請先匯出備份。</p></div></div><div class="tools"><div class="panel"><h3>📤 匯出與匯入</h3><p>將自建條目、物價筆記、收藏匯出為 JSON 檔。匯入可合併到現有資料，不需帳號。</p><button class="btn primary" data-export>⬇ 匯出完整備份</button><button class="btn soft" data-import>⬆ 匯入 JSON</button><input id="fileImport" type="file" accept=".json,application/json" hidden></div><div class="panel"><h3>🔧 管理自建內容</h3><p>目前有 ${state.users.length} 筆自建條目、${state.prices.length} 筆物價紀錄。官方公告資料不會被刪除。</p><button class="btn soft" data-dialog="entry">＋ 新增條目</button><button class="btn danger" data-action="clear">清空我的資料</button></div></div><div class="section-title"><div><h2>我的自建條目</h2></div></div><div class="cards">${state.users.length?state.users.map(card).join(''):empty('新增的怪物、裝備、任務和攻略都會顯示在這裡。','<button class="btn primary" data-dialog="entry">＋ 新增條目</button>')}</div><p class="footnote">StarDex 是非官方玩家工具，與 Nexon、MapleStar 營運方無關。<br>使用前請比對遊戲內最新資訊；官方遊戲素材的智慧財產權仍屬原權利人。</p>`}
function render(){document.getElementById('app').innerHTML=scaffold();const main=document.getElementById('content');main.innerHTML=({home, catalog, guide, market, mine})[state.tab]();renderModal()}
function updateCatalog(){const area=document.getElementById('catalogResults');if(area)area.innerHTML=resultHtml(getEntries());const filters=document.querySelectorAll('[data-filter]');filters.forEach(btn=>btn.classList.toggle('active',btn.dataset.filter===state.kind))}
function renderModal(){const host=document.getElementById('modalHost');if(!host)return;if(state.detail){const x=byId(state.detail);if(!x){state.detail=null;host.innerHTML='';return}const icon=KINDS[x.kind]?.icon||'📚',related=(x.related||'').split(/[、,，]/).map(v=>v.trim()).filter(Boolean);const fav=state.favs.includes(x.id);host.innerHTML=`<div class="overlay" data-backdrop><div class="modal" role="dialog" aria-modal="true" aria-label="條目詳情"><div class="modal-top"><div><span class="detail-icon">${icon}</span><h2>${esc(x.title)}</h2><p style="color:#93a0b1;font-size:12px;margin:8px 0">${KINDS[x.kind]?.title||'資料'}　${x.official?'<span class="tag official">官方公告</span>':'<span class="tag user">自建資料</span>'}</p></div><button class="close" data-close aria-label="關閉">×</button></div><div class="field-list"><div class="field"><label>等級或建議等級</label><span>${x.level?'Lv. '+esc(x.level):'尚未驗證'}</span></div><div class="field"><label>地區／分類</label><span>${x.region?esc(x.region):'尚未整理'}</span></div></div><h3 style="font-size:14px;margin:19px 0 8px">📖 詳細資訊</h3><div class="detail-text">${esc(x.note||'待補充')}</div>${related.length?`<h3 style="font-size:14px;margin:22px 0 6px">🔗 相關條目</h3><div class="related">${related.map(r=>{let match=all().find(y=>y.title===r);return match?`<button class="pill-link" data-detail="${esc(match.id)}">${esc(r)} ↗</button>`:`<span class="pill-link">${esc(r)}（尚未建檔）</span>`}).join('')}</div>`:''}<div class="source">${x.official?'來源：楓星官方更新公告':'來源：個人／玩家自行建檔'}<br>${x.source?`<a href="${esc(validUrl(x.source))}" target="_blank" rel="noopener noreferrer">開啟資料來源 ↗</a>`:'尚未附上可核對的資料來源'}${x.date?`<br>最後參考日期：${esc(x.date)}`:''}</div><div class="form-actions" style="justify-content:space-between"><button class="btn soft" data-fav="${esc(x.id)}">${fav?'★ 已收藏':'☆ 加入收藏'}</button><div class="two-actions">${x.official?'':`<button class="btn" data-edit="${esc(x.id)}">編輯</button><button class="btn danger" data-delete-entry="${esc(x.id)}">刪除</button>`}<button class="btn" data-close>關閉</button></div></div></div></div>`;return}
if(state.dialog==='entry'){const d=state.edit?byId(state.edit):null;host.innerHTML=`<div class="overlay" data-backdrop><div class="modal modal-wide" role="dialog" aria-modal="true" aria-label="新增資料"><div class="modal-top"><div><h2>${d?'✏️ 編輯資料':'📝 新增圖鑑資料'}</h2><p class="explain" style="margin:7px 0">你輸入的內容會保存在目前裝置，不會自動公開或送到任何伺服器。</p></div><button class="close" data-close>×</button></div><form id="entryForm"><div class="form-grid"><div class="form-group"><label for="entryKind">資料分類 *</label><select id="entryKind" name="kind" required>${kindKeys.map(k=>`<option value="${k}" ${(d?.kind||'monster')===k?'selected':''}>${KINDS[k].title}</option>`).join('')}</select></div><div class="form-group"><label for="entryTitle">名稱 *</label><input id="entryTitle" name="title" maxlength="100" required placeholder="如：殭屍菇菇" value="${esc(d?.title||'')}"></div><div class="form-group"><label>等級／建議等級（可留空）</label><input name="level" inputmode="numeric" type="number" min="1" max="9999" placeholder="資料不確定時請留空" value="${esc(d?.level||'')}"></div><div class="form-group"><label>出沒地區／分類</label><input name="region" maxlength="120" placeholder="如：奇幻村" value="${esc(d?.region||'')}"></div></div><div class="form-group"><label>關聯名稱（多個請用逗號分開）</label><input name="related" maxlength="400" placeholder="如：道具名稱、地圖名稱、怪物名稱" value="${esc(d?.related||'')}"></div><div class="form-group"><label>詳細說明 *</label><textarea name="note" maxlength="5000" required placeholder="記錄掉落物、任務流程、技能配點、練功推薦或攻略資訊。請寫清楚已確認與待確認的內容。">${esc(d?.note||'')}</textarea></div><div class="form-group"><label>原始資料網址（選填）</label><input name="source" type="url" placeholder="https://..." value="${esc(d?.source||'')}"><div class="form-hint">如果有官方公告、玩家實測影片或討論串，建議貼上來源連結。</div></div><div class="form-actions"><button class="btn" type="button" data-close>取消</button><button class="btn primary" type="submit">${d?'儲存修改':'新增資料'}</button></div></form></div></div>`;return}
if(state.dialog==='price'){host.innerHTML=`<div class="overlay" data-backdrop><div class="modal" role="dialog" aria-modal="true" aria-label="新增價格"><div class="modal-top"><div><h2>💰 新增物價紀錄</h2><p class="explain" style="margin:7px 0">僅紀錄你在遊戲中觀察的價格或實際成交價。</p></div><button class="close" data-close>×</button></div><form id="priceForm"><div class="form-group"><label>物品名稱 *</label><input name="item" maxlength="100" required placeholder="例如：神祕技能書"></div><div class="form-grid"><div class="form-group"><label>價格（楓幣）*</label><input name="price" type="number" inputmode="numeric" min="1" max="999999999999" step="1" required placeholder="例如：1000000"></div><div class="form-group"><label>資訊性質</label><select name="type"><option>觀察報價</option><option>實際成交</option><option>求購價</option></select></div></div><div class="form-group"><label>伺服器／世界</label><input name="world" maxlength="80" placeholder="選填"></div><div class="form-group"><label>附註</label><textarea name="memo" maxlength="500" placeholder="如：未含潛能、強化狀態、交易來源"></textarea></div><div class="form-actions"><button class="btn" type="button" data-close>取消</button><button class="btn primary" type="submit">儲存價格</button></div></form></div></div>`;return}host.innerHTML=''}
function closeModal(){state.detail=null;state.dialog=null;state.edit=null;renderModal()}
function favorites(id){if(!byId(id))return;state.favs=state.favs.includes(id)?state.favs.filter(a=>a!==id):[...state.favs,id];writeJSON(FK,state.favs);if(state.detail)renderModal();else render()}
function removeEntry(id){const x=state.users.find(x=>x.id===id);if(!x)return;if(!confirm(`確定刪除「${x.title}」？`))return;state.users=state.users.filter(x=>x.id!==id);state.favs=state.favs.filter(i=>i!==id);writeJSON(KEY,state.users);writeJSON(FK,state.favs);closeModal();render();notify('已刪除資料')}
function exportData(){const data={format:'StarDexBackup',version:1,exportedAt:new Date().toISOString(),entries:state.users,prices:state.prices,favorites:state.favs};const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='stardex-backup-'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000);notify('備份檔已產生')}
async function importData(file){if(!file)return;if(file.size>5e6){notify('檔案超過 5MB，請使用較小備份');return}try{const obj=JSON.parse(await file.text());if(obj.format!=='StarDexBackup'||obj.version!==1||!Array.isArray(obj.entries)||!Array.isArray(obj.prices)||!Array.isArray(obj.favorites))throw Error('格式不符');if(obj.entries.length>10000||obj.prices.length>20000)throw Error('資料筆數太多');const cleanEntries=obj.entries.filter(x=>x&&typeof x.id==='string'&&typeof x.title==='string'&&kindKeys.includes(x.kind)&&typeof x.note==='string').map(x=>({id:x.id.slice(0,120),kind:x.kind,title:x.title.slice(0,100),level:String(x.level||'').slice(0,8),region:String(x.region||'').slice(0,120),related:String(x.related||'').slice(0,400),note:x.note.slice(0,5000),source:validUrl(x.source||''),date:String(x.date||'').slice(0,20),official:false}));const cleanPrices=obj.prices.filter(x=>x&&typeof x.id==='string'&&typeof x.item==='string'&&Number.isFinite(Number(x.price))&&Number(x.price)>0).map(x=>({id:x.id.slice(0,120),item:x.item.slice(0,100),price:Number(x.price),type:String(x.type||'觀察報價').slice(0,50),world:String(x.world||'').slice(0,80),memo:String(x.memo||'').slice(0,500),ts:Number(x.ts)||Date.now()}));const known=new Map(state.users.map(x=>[x.id,x]));cleanEntries.forEach(x=>known.set(x.id,x));const kp=new Map(state.prices.map(x=>[x.id,x]));cleanPrices.forEach(x=>kp.set(x.id,x));state.users=[...known.values()];state.prices=[...kp.values()];state.favs=[...new Set([...state.favs,...obj.favorites.filter(x=>typeof x==='string')])];writeJSON(KEY,state.users);writeJSON(PK,state.prices);writeJSON(FK,state.favs);render();notify(`已匯入 ${cleanEntries.length} 筆資料及 ${cleanPrices.length} 筆價格`)}catch(err){notify('匯入失敗：'+err.message)}}
function makeId(prefix){return prefix+'-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,9)}
document.addEventListener('click',e=>{const t=e.target.closest('button');if(!t){if(e.target.matches('[data-backdrop]'))closeModal();return}if(t.dataset.tab){navigate(t.dataset.tab);return}if(t.dataset.kind){navigate('catalog',t.dataset.kind);return}if(t.dataset.filter){state.kind=t.dataset.filter;updateCatalog();return}if(t.dataset.detail){state.detail=t.dataset.detail;state.dialog=null;renderModal();return}if(t.dataset.fav){favorites(t.dataset.fav);return}if(t.dataset.close!==undefined){closeModal();return}if(t.dataset.dialog){state.dialog=t.dataset.dialog;state.detail=null;state.edit=null;renderModal();if(t.dataset.kindAdd){const sel=document.querySelector('#entryKind');if(sel)sel.value=t.dataset.kindAdd}return}if(t.dataset.edit){state.edit=t.dataset.edit;state.detail=null;state.dialog='entry';renderModal();return}if(t.dataset.deleteEntry){removeEntry(t.dataset.deleteEntry);return}if(t.dataset.export!==undefined){exportData();return}if(t.dataset.import!==undefined){document.getElementById('fileImport')?.click();return}if(t.dataset.removePrice){if(confirm('刪除這筆價格紀錄？')){state.prices=state.prices.filter(p=>p.id!==t.dataset.removePrice);writeJSON(PK,state.prices);render();notify('已移除價格紀錄')}return}if(t.dataset.marketSearch){document.querySelector('#priceReports')?.scrollIntoView({behavior:'smooth'});notify('請在下方尋找 '+t.dataset.marketSearch+' 的紀錄');return}if(t.dataset.action==='clear'){if(confirm('確定清空所有自建圖鑑、價格紀錄和收藏？此動作無法復原，建議先匯出備份。')){state.users=[];state.prices=[];state.favs=[];writeJSON(KEY,[]);writeJSON(PK,[]);writeJSON(FK,[]);render();notify('已清空個人資料')}return}});
document.addEventListener('input',e=>{if(e.target.id==='globalSearch'){state.query=e.target.value;updateCatalog()}});
document.addEventListener('change',e=>{if(e.target.id==='sort'){state.sort=e.target.value;updateCatalog()}if(e.target.id==='fileImport'){importData(e.target.files?.[0]);e.target.value=''}});
document.addEventListener('submit',e=>{if(e.target.id==='entryForm'){e.preventDefault();const form=new FormData(e.target);const title=String(form.get('title')||'').trim(),note=String(form.get('note')||'').trim(),kind=String(form.get('kind'));if(!title||!note||!kindKeys.includes(kind)){notify('請輸入分類、名稱與詳細說明');return}const source=String(form.get('source')||'').trim();if(source&&!validUrl(source)){notify('請使用 http 或 https 開頭的來源網址');return}const original=state.edit?byId(state.edit):null;const item={id:original?.id||makeId('user'),kind,title,level:String(form.get('level')||''),region:String(form.get('region')||'').trim(),related:String(form.get('related')||'').trim(),note,source:validUrl(source),date:new Date().toISOString().slice(0,10),official:false};if(original){state.users=state.users.map(x=>x.id===original.id?item:x)}else state.users.unshift(item);writeJSON(KEY,state.users);closeModal();render();notify(original?'已更新圖鑑資料':'已新增圖鑑資料')}if(e.target.id==='priceForm'){e.preventDefault();const form=new FormData(e.target),price=Number(form.get('price')),item=String(form.get('item')||'').trim();if(!item||!Number.isSafeInteger(price)||price<=0){notify('請輸入有效的物品與價格');return}state.prices.unshift({id:makeId('price'),item,price,type:String(form.get('type')||'觀察報價'),world:String(form.get('world')||'').trim(),memo:String(form.get('memo')||'').trim(),ts:Date.now()});writeJSON(PK,state.prices);closeModal();state.tab='market';render();notify('價格紀錄已儲存')}});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
render();
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script>
</body>
</html>
