<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#17253d">
  <meta name="color-scheme" content="light">
  <meta name="description" content="星圖鑑 StarDex — 楓星 MapleStar 專用的怪物、物品、地圖、職業、技能、任務、BOSS、攻略及行情資料庫。">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; object-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data: https:; connect-src 'self'; font-src 'self'; form-action 'self'">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="星圖鑑">
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" sizes="192x192" href="./icon-192.png">
  <link rel="stylesheet" href="./styles.css">
  <title>星圖鑑 StarDex｜楓星全功能圖鑑</title>
</head>
<body>
  <div id="app" aria-live="polite">
    <main class="fatal"><div class="mark">🍁</div><h1>正在開啟星圖鑑…</h1><p>載入楓星資料與本機收藏。</p></main>
  </div>
  <noscript>StarDex 需要 JavaScript 才能執行。</noscript>
  <div id="updateBanner" class="update-banner" hidden role="status" aria-live="polite">
    <span>StarDex 新版本已下載完成。本機資料不會因更新被刪除。</span>
    <button class="btn sm primary" type="button" data-apply-update>重新載入更新</button>
  </div>
  <script type="module" src="./js/app.js"></script>
</body>
</html>
